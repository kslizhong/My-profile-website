<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李钟 / 个人主页</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --accent: #e8c97a;
      --accent2: #c4a35a;
      --border: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'Noto Serif SC', 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        #0f0f1a 0%,
        #1a1a2e 20%,
        #16213e 40%,
        #0f3460 60%,
        #1a1a2e 80%,
        #0f0f1a 100%
      );
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      z-index: 0;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      text-align: center;
      padding: 56px 48px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: -1px;
      box-shadow: 0 0 32px rgba(232, 201, 122, 0.3);
    }

    .name {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .role {
      font-size: 14px;
      color: var(--accent);
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 32px;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 32px;
    }

    .bio {
      font-size: 15px;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.9;
    }

    .desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.9;
      margin-bottom: 44px;
    }

    .social {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .social a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 22px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 13px;
      transition: all 0.25s;
    }

    .social a:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232, 201, 122, 0.06);
      transform: translateY(-2px);
    }

    .social svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
      .name { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="avatar">李</div>
  <h1 class="name">李钟</h1>
  <p class="role">财务审计咨询师</p>
  <div class="divider"></div>
  <p class="bio">用数字讲述故事，用专业守护信任。</p>
  <p class="desc">
    深耕财务审计与咨询领域多年，为企业提供合规审查、内部控制及财务尽调等专业服务。
    擅长将复杂的财务逻辑转化为清晰的解决方案，追求精准与严谨。
    工作之余关注会计准则动态与行业洞察，持续精进专业能力。
  </p>
